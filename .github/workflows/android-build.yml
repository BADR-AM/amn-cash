name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Build Debug APK
      run: |
        cd android
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMN-Cash-Collector-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-android
        name: "AMN Cash Android Collector APK v1.0.0"
        body: |
          ### تطبيق الأندرويد المساعد AMN Cash Android Collector
          - التقاط رسائل فودافون كاش ومزامنتها لحظياً مع حاسوب الويندوز
          - فلترة كاملة لرسائل OTP والرموز السرية لحماية الخصوصية
          - توقيع رقمي مشفر HMAC-SHA256
          - تشغيل في الخلفية Foreground Service
        files: android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
